<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Evo DOM Bridge</title>
    <style>
      body { margin: 0; width: 360px; background: #070b14; color: #e2e8f0; font-family: Inter, system-ui, sans-serif; }
      main { padding: 16px; display: grid; gap: 12px; }
      h1 { font-size: 14px; margin: 0; letter-spacing: .08em; text-transform: uppercase; }
      p { color: #94a3b8; font-size: 12px; line-height: 1.45; margin: 0; }
      button { border: 1px solid #4f46e5; background: #312e81; color: white; border-radius: 10px; padding: 10px 12px; font-weight: 800; cursor: pointer; }
      button.secondary { background: #111827; border-color: #334155; }
      pre { white-space: pre-wrap; background: #020617; border: 1px solid #1e293b; border-radius: 10px; padding: 10px; max-height: 180px; overflow: auto; font-size: 11px; }
      .danger { color: #fca5a5; }
    </style>
  </head>
  <body>
    <main>
      <h1>PH Evo DOM Bridge</h1>
      <p>Approval-gated active-tab bridge. It snapshots the page and can apply only contract-approved DOM changes.</p>
      <button id="snapshot">Snapshot Active Tab</button>
      <button id="highlight" class="secondary">Highlight Interactive Elements</button>
      <p class="danger">No silent page mutation. No background surveillance. No weird goblin behavior.</p>
      <pre id="output">Ready.</pre>
    </main>
    <script type="module" src="popup.js"></script>
  </body>
</html>
