name: Evo Studio CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Run Syntax Checks
        run: node scripts/benchmark-load.mjs http://127.0.0.1:5173/ 5 1000 &
        
      - name: Build Vite App
        run: npm run build
